<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F63C6">
<meta name="description" content="MyWeather: weather updates, emergency alerts and sea conditions in one place.">
<title>MyWeather</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app column, centered on wide screens. Theme is the original MyWeather blue, single look by design. */
:root{--blue:#1F63C6;--blue-d:#134A9B;--bg:#F2F6FC;--card:#FFFFFF;--pill:#E4EEFC;--bor:#E0E8F4;--navy:#0F2347;--mut:#5B6B8A;--amber:#F9B93A;--sun:#E08A00;
--low:#34A56F;--mod:#F2B138;--high:#E8731E;--vhigh:#C4252F;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;background:#DCE6F5;color:var(--navy);font-family:var(--font);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
#app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:520px) and (min-height:600px){#app{height:min(900px,calc(100% - 40px));border-radius:34px;box-shadow:0 30px 80px rgba(15,35,71,.28),0 0 0 8px #EDEFF3,0 0 0 9px #C9CED8}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 20px 112px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:27px;font-weight:800;margin:0;letter-spacing:-.01em}
.pad-t{padding-top:18px}
/* ---------- splash ---------- */
#splash{background:#FEFEFE;align-items:center;overflow:hidden;z-index:50;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
.sun{position:absolute;width:220px;height:220px;border-radius:50%;background:#FFF1CC;right:-70px;top:-70px}
.cloudg{position:absolute;width:170px;height:170px;border-radius:50%;background:#EAF2FD;left:-89px;top:23%}
.sp-body{margin-top:31%;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2}
.sp-logo{width:203px;height:auto}
.wm{display:flex;gap:10px;font-size:34px;letter-spacing:.04em;margin-top:6px}
.wm b{font-weight:800;color:var(--blue-d)}.wm span{font-weight:400;color:var(--blue)}
.tag{font-size:17px;font-weight:500;color:#54617D;line-height:23px;margin:14px 0 0;max-width:320px}
.loader{width:120px;height:26px;margin-top:22px;overflow:hidden}
.loader svg{width:240px;animation:slide 1.1s linear infinite}
@keyframes slide{to{transform:translateX(-120px)}}
.bw{position:absolute;left:0;right:0;bottom:0;height:110px}
.bw svg{position:absolute;bottom:0;width:200%;height:100%;left:0}
.bw .l{animation:drift 7s ease-in-out infinite alternate}.bw .d{animation:drift 5s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(-12%)}}
/* ---------- login ---------- */
#login{z-index:40;overflow:hidden}
#login .sun{width:200px;height:200px;right:-60px;top:-90px}
.lg-in{position:relative;z-index:2;padding:64px 20px 0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;scrollbar-width:none}
.lg-in img{width:88px}
.lg-in h2{font-size:26px;font-weight:800;margin:18px 0 8px;text-align:center}
.lg-in p{margin:0 0 26px;text-align:center;color:var(--mut);font-weight:500;font-size:14px;line-height:21px;max-width:320px}
.field{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 18px;background:#fff;border:1px solid var(--bor);border-radius:18px;margin-bottom:12px;color:var(--blue)}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,99,198,.14)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:500;font-size:15px;color:var(--navy)}
.field input::placeholder{color:#8A97B0}
.field .eye{color:var(--mut)}
.link{color:var(--blue);font-weight:600;font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;font-weight:700;font-size:16px}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(31,99,198,.3)}
.btn.s{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn:active{transform:scale(.985)}
/* ---------- header / nav ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:19px 20px 17px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 16px rgba(31,99,198,.06);margin:0 -20px 20px}
.brand{display:flex;align-items:center;gap:16px;font-size:22px;letter-spacing:-.01em}
.brand img{width:46px}.brand b{font-weight:800;color:var(--blue-d)}.brand span{font-weight:600;color:var(--blue)}
.icon-btn{width:44px;height:44px;border-radius:14px;background:#EEF4FD;border:1px solid #D4E2F7;display:grid;place-items:center;color:var(--blue)}
.icon-btn.w{background:#fff;border-color:var(--bor);color:var(--navy)}
#nav{position:absolute;left:14px;right:14px;bottom:15px;height:68px;background:#fff;border-radius:28px;display:flex;padding:8px 6px;gap:2px;box-shadow:0 8px 24px rgba(31,99,198,.16);z-index:20}
#nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:20px;color:var(--mut);font-size:11.5px;font-weight:500;transition:background .2s,color .2s}
#nav button.on{background:var(--pill);color:var(--blue);font-weight:700}
/* ---------- home ---------- */
.hero{position:relative;background:var(--blue);color:#fff;border-radius:24px;padding:20px 22px 22px;box-shadow:0 14px 28px rgba(31,99,198,.28);cursor:pointer;overflow:hidden;min-height:258px}
.hero-city{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:#fff;letter-spacing:-.01em}
.hero-city svg{transition:transform .2s}.hero-city.open svg{transform:rotate(180deg)}
.hero-date{font-size:14px;font-weight:500;opacity:.92;margin-top:8px}
.temp{font-size:70px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:14px;display:flex;align-items:flex-start}
.temp small{font-size:30px;font-weight:700;letter-spacing:0;margin:34px 0 0 4px}
.cond{font-size:20px;font-weight:500;margin-top:4px}
.wchip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:20px;padding:9px 16px 9px 14px;font-weight:600;font-size:14px;margin-top:14px}
.bigicon{position:absolute;right:20px;top:88px}
.alertbn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px;background:#FFF3D1;border:1px solid #F6DC93;border-radius:16px;padding:14px 16px 14px 17px;color:#4A2F00;font-weight:700;font-size:15px;line-height:21px}
.alertbn .ab{flex:none;width:30px;height:40px;border-radius:14px;background:var(--amber);display:grid;place-items:center;color:var(--navy)}
h3{font-size:18px;font-weight:700;margin:22px 0 12px}
.near{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nc{background:#fff;border:1px solid var(--bor);border-radius:20px;padding:13px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:11px;transition:transform .15s,box-shadow .2s}
.nc:hover{box-shadow:0 8px 18px rgba(31,99,198,.12)}.nc:active{transform:scale(.97)}
.nc span{font-size:14px;font-weight:500;color:var(--mut)}.nc b{font-size:21px;font-weight:800}
.menu{position:absolute;z-index:30;background:#fff;border-radius:20px;padding:8px;box-shadow:0 10px 30px rgba(31,99,198,.24);min-width:270px;animation:fade .18s both}
.menu .mh{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);padding:8px 12px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;font-weight:500;font-size:15px;color:var(--navy)}
.menu button svg:first-child{color:var(--mut)}
.menu button.on{background:var(--pill);color:var(--blue);font-weight:700}.menu button.on svg:first-child{color:var(--blue)}
.menu button .ck{margin-left:auto;color:var(--blue)}
.scrim{position:absolute;inset:0;background:rgba(15,35,71,.12);z-index:25}
/* ---------- forecast ---------- */
.fhead{display:flex;align-items:center;gap:14px;padding-top:24px}
.fhead h1{font-size:26px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--bor);border-radius:22px;padding:8px 14px;font-size:16px;font-weight:600;margin-top:18px}
.chipbtn svg:first-child{color:var(--blue)}.chipbtn svg:last-child{color:var(--mut)}
.today{background:var(--blue);border-radius:24px;padding:18px 19px 19px;color:#fff;box-shadow:0 14px 28px rgba(31,99,198,.28);margin-top:18px}
.trow{display:flex;gap:13px;align-items:flex-start}
.tile{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.trow small{font-size:14px;font-weight:500;opacity:.92}
.trow .big{font-size:32px;font-weight:800;line-height:1.15;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.trow .big em{font-style:normal;font-size:19px;font-weight:500}
.hours{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#fff;border-radius:20px;padding:6px;margin-top:14px;color:var(--navy)}
.hr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 9px;border-radius:16px;transition:background .2s}
.hr span{font-size:12.5px;font-weight:500;color:var(--mut)}.hr b{font-size:17px;font-weight:800}.hr svg{color:var(--blue)}
.hr.on{background:var(--pill)}
.days{background:#fff;border:1px solid var(--bor);border-radius:22px;overflow:hidden}
.day{width:100%;text-align:left;display:block}
.dr{display:flex;align-items:center;padding:0 18px;height:45px;gap:10px}
.dr .dn{width:68px;display:flex;align-items:baseline;gap:6px}.dn b{font-size:17px;font-weight:800}.dn span{font-size:14px;color:var(--mut);font-weight:500}
.dr .ci{color:var(--blue);width:34px}.dr .cd{flex:1;font-size:16px;font-weight:500;color:var(--mut)}.dr .tp{font-size:18px;font-weight:800}
.day+.day{border-top:1px solid #E3EAF5}
.dd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:2px 18px 14px;animation:fade .2s both}
.dd div{background:var(--bg);border-radius:14px;padding:9px 6px;text-align:center}.dd span{display:block;font-size:11px;color:var(--mut);font-weight:600}.dd b{font-size:14px;font-weight:800}
/* ---------- alerts ---------- */
.locl{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:600;font-size:16px;margin-top:8px}.locl svg{color:var(--blue)}
.flood{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:#FFE9E7;border:1px solid #F5B8B2;border-radius:18px;padding:14px 16px;margin-top:18px}
.circ{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.flood b{font-size:18px;font-weight:800;color:#9B1C12}.flood p{margin:3px 0 0;color:#7A1B13;font-size:14px;font-weight:500;line-height:19px}
.flood .tm{margin-left:auto;font-size:14px;font-weight:600;color:#9B1C12;white-space:nowrap;padding-top:2px}
.rainb{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;background:#E6F0FD;border:1px solid #BFD4F2;border-radius:18px;padding:12px 16px;font-size:19px;font-weight:800;color:var(--blue-d)}
.rainb svg:last-child{margin-left:auto}
.chips{display:flex;gap:8px;margin:16px 0 12px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:11px 19px;border-radius:22px;background:#fff;border:1px solid var(--bor);font-size:15px;font-weight:700;transition:all .15s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.al{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--bor);border-radius:20px;padding:14px 16px 14px 14px;margin-bottom:11px;transition:transform .15s,box-shadow .2s}
.al:hover{box-shadow:0 8px 18px rgba(31,99,198,.1)}.al:active{transform:scale(.985)}
.al .tt{flex:1;min-width:0}.al b{display:block;font-size:16px;font-weight:800;margin-bottom:5px}
.al>svg:last-child{color:var(--mut);flex:none}
.pill{display:inline-block;border-radius:10px;padding:3px 10px;font-size:13px;font-weight:600}
.pill.r1{background:#DFF3E8;color:#1B6B3F}.pill.r2{background:#FFF1D1;color:#7A5200}.pill.r3{background:#FFE4D3;color:#9A3B00}.pill.r4{background:#FFD9D4;color:#9B1C12}
.empty{padding:36px 10px;text-align:center;color:var(--mut);font-weight:500}
/* ---------- sheet ---------- */
.sheetwrap{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(15,35,71,.4);animation:sc .2s both}
@keyframes sc{from{opacity:0}}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 26px;box-shadow:0 -6px 24px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.2,.8,.2,1) both;max-height:88%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:#D5DEEC;margin:0 auto 16px}
.sh-h{display:flex;gap:14px;align-items:center}.sh-h .circ{width:48px;height:48px}
.sh-h h4{margin:0 0 5px;font-size:19px;font-weight:800}
.sh-h small{font-size:13px;color:var(--mut);font-weight:500;margin-left:6px}
.sheet p{color:var(--mut);font-weight:500;font-size:15px;line-height:21px;margin:14px 0}
.sheet h5{margin:0 0 10px;font-size:12px;letter-spacing:.08em;color:var(--mut);font-weight:700}
.sheet ul{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:10px}
.sheet li{display:flex;gap:10px;font-size:15px;font-weight:500;line-height:21px}
.sheet li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pill);color:var(--blue);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
/* ---------- locations ---------- */
.search{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 16px;background:#fff;border:1px solid var(--bor);border-radius:24px;color:var(--mut);margin-top:14px;text-align:left;font-size:15px;font-weight:500}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--navy);font-weight:500}
.search input::placeholder{color:#8A97B0}
.search.f{border:1.5px solid var(--blue);color:var(--blue)}
.lab{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin:18px 0 10px}
.saved{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.sv{flex:none;display:flex;align-items:center;gap:6px;padding:11px 14px;border-radius:22px;background:#fff;border:1px solid var(--bor);font-size:14px;font-weight:700}
.sv svg{color:var(--blue)}.sv.on{background:var(--blue);border-color:var(--blue);color:#fff}.sv.on svg{color:#fff}
.sv .x{margin-left:2px;opacity:.8}
.lcard{position:relative;background:var(--blue);color:#fff;border-radius:24px;padding:16px 20px 18px;box-shadow:0 14px 28px rgba(31,99,198,.28);margin-top:14px;cursor:pointer;overflow:hidden}
.lcard .nm{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:800}
.lcard .dt{font-size:13px;font-weight:500;opacity:.9;margin-top:5px}
.lcard .tp{font-size:50px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.lcard .cd{font-size:18px;font-weight:500}
.lcard .bi{position:absolute;right:18px;top:40px}
.pills{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pills span{background:rgba(255,255,255,.17);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600}
.savebtn{position:absolute;right:14px;top:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:7px 11px;font-size:12px;font-weight:700;display:flex;gap:5px;align-items:center;color:#fff}
.tabs{display:flex;background:var(--pill);border-radius:21px;padding:4px;gap:4px;margin-top:14px}
.tabs button{flex:1;height:34px;border-radius:18px;font-size:14px;font-weight:700;color:var(--mut)}.tabs button.on{background:var(--blue);color:#fff}
.hrs{display:flex;gap:8px;margin-top:12px}
.hc{flex:1;background:#fff;border:1px solid var(--bor);border-radius:16px;padding:7px 0 8px;text-align:center}
.hc.on{border:1.5px solid var(--blue)}.hc span{display:block;font-size:11px;font-weight:500;color:var(--mut)}.hc b{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:800;margin-top:3px}.hc b svg{color:var(--blue)}
.emg{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:#fff;border:1px solid var(--bor);border-radius:18px;padding:10px 14px 10px 12px;text-align:left}
.emg .circ{width:36px;height:36px}.emg b{display:block;font-size:15px;font-weight:800}.emg span{font-size:12px;color:var(--mut);font-weight:500}.emg>svg:last-child{margin-left:auto;color:var(--mut)}
.chat{background:#fff;border:1px solid var(--bor);border-radius:24px;margin-top:14px;overflow:hidden}
.chh{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.chh .circ{width:30px;height:30px;background:var(--blue)}.chh b{font-size:15px;font-weight:800;display:block}.chh span{font-size:11px;color:var(--mut);font-weight:500;display:flex;align-items:center;gap:5px}.chh i{width:7px;height:7px;border-radius:50%;background:var(--low)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:10px 16px;max-height:230px;overflow-y:auto;scrollbar-width:thin}
.m{max-width:86%;padding:7px 12px;border-radius:14px;font-size:13px;line-height:18px;font-weight:500;animation:fade .2s both}
.m.u{align-self:flex-end;background:var(--blue);color:#fff;font-weight:600;border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:var(--bg);border-top-left-radius:4px}
.m.b a{color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline}
.typing{display:flex;gap:4px;padding:11px 14px}.typing i{width:6px;height:6px;border-radius:50%;background:#9AAFD3;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{transform:translateY(-4px);opacity:.5}}
.qr{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.qr button{flex:none;background:var(--pill);color:var(--blue);border-radius:14px;padding:6px 11px;font-size:12px;font-weight:700}
.cin{display:flex;align-items:center;gap:8px;margin:0 16px 14px;background:var(--bg);border:1px solid var(--bor);border-radius:18px;padding:4px 4px 4px 14px}
.cin input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;font-weight:500;height:28px}
.cin button{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--bor);border-radius:18px;padding:11px 16px 11px 14px;margin-bottom:8px}
.res .ci{width:36px;height:36px;border-radius:12px;background:var(--pill);color:var(--blue);display:grid;place-items:center;flex:none}
.res div{flex:1;min-width:0}.res b{display:block;font-size:15px;font-weight:800}.res span{font-size:12px;color:var(--mut);font-weight:500}.res em{font-style:normal;font-weight:800;font-size:16px;color:var(--blue)}
/* ---------- sea ---------- */
.seg{display:flex;background:var(--pill);border-radius:26px;padding:4px;margin-top:12px}
.seg button{flex:1;height:44px;border-radius:22px;font-size:16px;font-weight:700;color:#54617D}
.seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 3px 10px rgba(31,99,198,.14)}
.tbl{background:#fff;border:1px solid var(--bor);border-radius:24px;padding:14px 18px 6px;margin-top:12px}
.th,.tr{display:grid;grid-template-columns:1.25fr 1fr 1.15fr;align-items:center;gap:6px}
.th{padding-bottom:10px;border-bottom:1px solid #E3EAF5;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.th button{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-align:left;display:flex;align-items:center;gap:3px;line-height:1.2}
.th button:last-child{justify-content:flex-end}.th button.on{color:var(--blue)}
.tr{width:100%;height:54px;text-align:left;border-bottom:1px solid #E3EAF5}.tr:last-child{border:0}
.tr:hover{background:#F7FAFE}
.tr b{font-weight:700;font-size:16px}.tr .h{font-weight:800;font-size:17px}
.lv{justify-self:end;display:inline-flex;align-items:center;gap:6px;border-radius:16px;padding:6px 11px;font-size:13.5px;font-weight:700}
.lv.Low{background:#DDF0E5;color:#1B6B3F}.lv.Moderate{background:#FDEFD0;color:#7A4B00}.lv.High{background:#FDE0CF;color:#9A3B00}.lv.VeryHigh{background:#FBD9DD;color:#8E1620}
.mapwrap{flex:1;min-height:0;padding:12px 20px 96px;display:flex}
.map{position:relative;flex:1;border-radius:24px;border:1px solid #BFD4F2;background:#E4EEFC;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.map.drag{cursor:grabbing}
#msvg{position:absolute;inset:0;width:100%;height:100%}
.land{vector-effect:non-scaling-stroke}
.mk{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;display:grid;place-items:center;z-index:3}
.mk i{display:block;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.28);transition:width .15s,height .15s}
.mk.sel{z-index:4}.mk.sel i{width:26px;height:26px;border:3.5px solid var(--navy);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.3)}
.mk em{position:absolute;top:100%;margin-top:-4px;font-style:normal;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 6px;white-space:nowrap;pointer-events:none}
.info{position:absolute;left:14px;top:13px;background:#fff;border-radius:16px;padding:10px 14px 11px;box-shadow:0 6px 16px rgba(31,99,198,.16);z-index:6;max-width:55%}
.info b{display:block;font-size:16px;font-weight:800;margin-bottom:3px}.info span.w{font-size:13.5px;color:var(--mut);font-weight:500;margin-right:8px}
.info small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;margin-top:6px}
.legend{position:absolute;right:14px;top:13px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 6px 16px rgba(31,99,198,.16);z-index:6;display:flex;flex-direction:column;gap:4px}
.legend button{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;text-align:left;padding:2px 0}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}.legend button.off{opacity:.35;text-decoration:line-through}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:6}
.zoom button{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(31,99,198,.16);display:grid;place-items:center}
.zoom button:disabled{opacity:.4}
.scale{position:absolute;left:16px;bottom:14px;z-index:6;font-size:10px;font-weight:600}.scale i{display:block;height:3px;border-radius:2px;background:var(--navy);margin-bottom:2px}
.home-btn{position:absolute;right:14px;bottom:122px;z-index:6}
#toast{position:absolute;left:50%;bottom:98px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:80;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function mapInit(){
 var el=$('#map');if(!el)return;
 var W=el.clientWidth,H=el.clientHeight;MAP.W=W;MAP.H=H;MAP.s0=Math.min(W/350,H/560);

 [118,120,122,124,126].forEach(function(lon){var x=mx(lon);g+='<line x1="'+x+'" y1="-40" x2="'+x+'" y2="600" stroke="#A9C4EC" stroke-opacity=".6" stroke-width=".8" vector-effect="non-scaling-stroke"/><text class="gt" data-fs="9" x="'+(x+2)+'" y="556" fill="#7FA0D6" font-weight="500">'+lon+'°E</text>'});
 [6,8,10,12,14,16,18,20].forEach(function(lat){var y=my(lat);g+='<line x1="-40" y1="'+y+'" x2="400" y2="'+y+'" stroke="#A9C4EC" stroke-opacity=".6" stroke-width=".8" vector-effect="non-scaling-stroke"/><text class="gt" data-fs="9" x="2" y="'+(y-2)+'" fill="#7FA0D6" font-weight="500">'+lat+'°N</text>'});
 var lbl=function(t,lat,lon,c,ls){return '<text class="gt" data-fs="'+(ls?9:10)+'" x="'+mx(lon)+'" y="'+my(lat)+'" text-anchor="middle" fill="'+c+'" font-weight="700" letter-spacing="'+(ls?'2':'1.2')+'">'+t+'</text>'};
 g+=lbl('PHILIPPINE SEA',20.2,125.5,'#8FB0E0')+lbl('WEST PHILIPPINE SEA',15.6,117.55,'#8FB0E0')+lbl('SULU SEA',8.9,119.6,'#8FB0E0')+lbl('CELEBES SEA',4.9,123.3,'#8FB0E0')+lbl('LUZON',16.7,121.0,'#A4B8DA',1)+lbl('VISAYAS',11.55,123.0,'#A4B8DA',1)+lbl('MINDANAO',7.9,124.6,'#A4B8DA',1)+lbl('PALAWAN',9.3,117.9,'#A4B8DA',1);
 el.innerHTML='<svg id="msvg" font-family="Plus Jakarta Sans,sans-serif"><g id="mg"><g>'+g+'</g><path class="land" d="'+NB_D+'" fill="#EBF0F8" stroke="#BCD0EE" stroke-width="1"/><path class="land" d="'+PH_D+'" fill="#fff" stroke="#8FB3E6" stroke-width="1"/></g></svg>'
 +'<div id="mks"></div><div class="info" id="info"></div><div class="legend" id="legend"></div><div class="zoom"><button data-act="zin" aria-label="Zoom in">'+I('plus',20,2.6)+'</button><button data-act="zout" aria-label="Zoom out">'+I('minus',20,2.6)+'</button><button data-act="zreset" aria-label="Reset view">'+I('target',20,2.2)+'</button></div><div class="scale" id="scale"></div>';
 MAP.z=1;MAP.tx=(W-350*MAP.s0)/2;MAP.ty=(H-560*MAP.s0)/2;
 mapInfo();mapDraw();
 var sel=SEA.filter(function(s){return s.n===S.seaSel})[0];if(sel&&S.flyOnOpen){flyTo(sel,2.4)}S.flyOnOpen=false;
 // gestures
 var d=null,moved=false;
 el.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;d={x:e.clientX,y:e.clientY,tx:MAP.tx,ty:MAP.ty};moved=false});
 el.addEventListener('pointermove',function(e){if(!d)return;var dx=e.clientX-d.x,dy=e.clientY-d.y;if(!moved&&Math.abs(dx)+Math.abs(dy)<4)return;if(!moved){moved=true;el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(x){}}MAP.tx=d.tx+dx;MAP.ty=d.ty+dy;clamp();mapDraw()});
 var up=function(){d=null;el.classList.remove('drag')};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 el.addEventListener('wheel',function(e){e.preventDefault();var r=el.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.25:0.8)},{passive:false});
}
function clamp(){var S0=MAP.s0*MAP.z,w=350*S0,h=560*S0;MAP.tx=Math.min(MAP.W*0.6,Math.max(MAP.W*0.4-w,MAP.tx));MAP.ty=Math.min(MAP.H*0.6,Math.max(MAP.H*0.4-h,MAP.ty))}
function zoomAt(cx,cy,f){var nz=Math.max(1,Math.min(8,MAP.z*f));f=nz/MAP.z;MAP.tx=cx-(cx-MAP.tx)*f;MAP.ty=cy-(cy-MAP.ty)*f;MAP.z=nz;clamp();mapDraw()}
var fly=0;
function flyTo(s,z){cancelAnimationFrame(fly);var z0=MAP.z,tx0=MAP.tx,ty0=MAP.ty,z1=Math.max(z0,z||2),S1=MAP.s0*z1,tx1=MAP.W/2-mx(s.lon)*S1,ty1=MAP.H/2-my(s.lat)*S1,t0=performance.now();
 (function step(t){var p=Math.min(1,(t-t0)/380),e=1-Math.pow(1-p,3);MAP.z=z0+(z1-z0)*e;MAP.tx=tx0+(tx1-tx0)*e;MAP.ty=ty0+(ty1-ty0)*e;mapDraw();if(p<1)fly=requestAnimationFrame(step)})(t0)}
function mapInfo(){

 $('#info').innerHTML='<b>'+s.n+'</b><span class="w">Wave '+s.h.toFixed(1)+' m</span><span class="lv '+lvcls(s.l)+'" style="padding:3px 10px;font-size:12px">'+s.l+'</span><small>Wind '+s.w+' km/h · Period '+s.p+' s</small>';

 $('#mks').innerHTML=html;

 var zb=el.querySelectorAll('.zoom button');if(zb.length){zb[0].disabled=MAP.z>=7.9;zb[1].disabled=MAP.z<=1.01}
}

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,id=t.dataset.id;
 switch(a){
 case 'nav':if(t.dataset.to==='sea'&&S.screen!=='sea'){S.seaView='table'}go(t.dataset.to);closeSheet();break;
 case 'homeMenu':e.stopPropagation();S.homeMenu=!S.homeMenu;render();break;
 case 'setHome':e.stopPropagation();S.homeCity=id;S.homeMenu=false;render();break;
 case 'locate':S.homeCity='Las Piñas';render();toast('Using your current location: Las Piñas City');break;
 case 'openLoc':S.locCity=id;S.locTab='Hourly';go('locations');break;
 case 'fcMenu':S.fcMenu=!S.fcMenu;render();break;
 case 'setFc':S.fcCity=id;S.fcMenu=false;render();break;
 case 'hour':S.fcHour=+t.dataset.i;render();break;
 case 'day':var i=+t.dataset.i;S.fcDay=S.fcDay===i?-1:i;render();break;
 case 'filter':S.alertF=id;render();break;
 case 'sheet':e.stopPropagation();sheet(id);break;
 case 'closeSheet':if(e.target===t||t.classList.contains('btn')){closeSheet()}break;
 case 'setLoc':S.locCity=id;S.locTab='Hourly';render();break;
 case 'save':e.stopPropagation();var k=S.saved.indexOf(id);if(k>-1){if(S.saved.length>1){S.saved.splice(k,1);toast(id+' removed from saved locations')}else toast('Keep at least one saved location')}else{S.saved.push(id);toast(id+' saved')}render();break;
 case 'locTab':S.locTab=id;render();break;
 case 'ask':say(t.dataset.q);break;
 case 'seaView':S.seaView=id;S.flyOnOpen=false;render();break;
 case 'sort':if(S.sort.k===id)S.sort.d=-S.sort.d;else S.sort={k:id,d:1};render();break;
 case 'seaPick':S.seaSel=id;S.seaView='map';S.flyOnOpen=true;go('sea');break;
 case 'mark':S.seaSel=id;mapInfo();var s=SEA.filter(function(x){return x.n===id})[0];flyTo(s,Math.max(MAP.z,2));break;
 case 'zin':zoomAt(MAP.W/2,MAP.H/2,1.6);break;
 case 'zout':zoomAt(MAP.W/2,MAP.H/2,1/1.6);break;
 case 'zreset':cancelAnimationFrame(fly);MAP.z=1;MAP.tx=(MAP.W-350*MAP.s0)/2;MAP.ty=(MAP.H-560*MAP.s0)/2;mapDraw();break;
 case 'lvl':S.hidden[id]=!S.hidden[id];mapInfo();mapDraw();break;
 }
